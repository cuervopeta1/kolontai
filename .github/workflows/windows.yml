# Kolontái — construye el .exe y el instalador de Windows en GitHub Actions
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Se ejecuta a mano (pestaña Actions > "Construir para Windows" > Run workflow)
# o al publicar una etiqueta de versión:  git tag v0.3.0 && git push --tags

name: Construir para Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # para adjuntar el instalador a la versión publicada

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Correr las pruebas
        run: python -m pytest -q pruebas

      - name: Construir Kolontai.exe
        run: pyinstaller --noconfirm kolontai.spec

      - name: Construir el instalador
        run: |
          $version = python -c "import kolontai; print(kolontai.__version__)"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" instalador\kolontai.iss
          Compress-Archive -Path dist\Kolontai -DestinationPath "instalador\salida\Kolontai-$version-portable.zip"

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: Kolontai-windows
          path: instalador/salida/*

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: instalador/salida/*
